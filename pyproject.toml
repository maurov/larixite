[build-system]
requires = ["setuptools>=45", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "larixite/version.py"
version_scheme = "post-release"

[tool.setuptools.packages.find]
include = ["larixite"]

[project]
name = "larixite"
dynamic = ["version"]
requires-python = ">= 3.11"
description = "convert CIF data to inputs for XAS calculations Feff, FDMNES, etc"
readme = "README.md"
authors = [
     {name = "Matthew Newville", email = "newville@cars.uchicago.edu"},
     {name = "Mauro Rovezzi", email = "mauro.rovezzi@esrf.fr"}
]

dependencies = [
    "xraydb",
    "sqlalchemy>=2",
    "pymatgen>=2025.6.14",
    "mp-api>=0.45.8",
    "emmet-core>=0.84.9",
    "requests",
    "py3Dmol",
]

license = "MIT"
license-files = ["LICENSE"]
keywords = ["X-ray spectroscopy", "Crystallography"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]

[project.urls]
Homepage = " https://github.com/xraypy/larixite"
Documentation = "https://xraypy.github.io/larixite"
Tracker = "https://github.com/xraypy/larixite/issues"

[project.optional-dependencies]
web = ["flask"]
jupyter = ["jupyterlab==3.*", "crystal-toolkit>=2025.7.31"]
test = ["pytest", "pytest-cov", "pygments"]
doc = ["sphinx"]
dev = [
    "larixite[test]",
    "build",
    "twine",
    "pre-commit",
    "ruff",
    "mypy",
    "scipy-stubs",
    "types-PyYAML",
    "types-requests",
    "pytest-xdist",
    "hypothesis",
]
all = ["larixite[dev,web,test,doc,jupyter]"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "^doc/",
    "^examples/",
]
